<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOVEREIGN — Bangun Negaramu</title>
<meta name="description" content="SOVEREIGN — game nation builder 3D. Bangun negaramu dari nol, jadi presiden, dan dirikan negara-negara baru.">
<meta name="theme-color" content="#081427">
<meta property="og:title" content="SOVEREIGN — Bangun Negaramu">
<meta property="og:description" content="Nation builder 3D: bangun kota, kelola ekonomi, dan pimpin hingga 5 negara.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ee0c8'/%3E%3Cstop offset='1' stop-color='%238f7dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23081427'/%3E%3Cpath d='M14 44h36M18 44V28M26 44V28M38 44V28M46 44V28M12 28l20-12 20 12z' stroke='url(%23g)' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(11,22,42,.72);--glass2:rgba(16,31,56,.86);--line:rgba(150,190,255,.13);--line2:rgba(150,190,255,.26);
  --txt:#e9f1ff;--mut:#8fa4c6;--dim:#5f7396;
  --acc:#3ee0c8;--acc2:#7d8cff;--grad:linear-gradient(135deg,#3ee0c8 0%,#5aa9ff 55%,#8f7dff 100%);
  --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;
  --r:16px;--shadow:0 18px 50px rgba(2,8,22,.5),inset 0 1px 0 rgba(255,255,255,.06);
  --fd:'Unbounded',system-ui,sans-serif;--fb:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#081427;color:var(--txt);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(150,190,255,.18);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:stretch;pointer-events:none}
#top>*{pointer-events:auto}
.nation{display:flex;align-items:center;gap:12px;padding:9px 14px 9px 10px;min-width:0;max-width:300px;cursor:pointer;transition:border-color .2s,transform .2s;flex:none}
.nation:hover{border-color:var(--line2)}
.flag{width:46px;height:31px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 4px 14px rgba(0,0,0,.35);flex:none}
.flag.sm{width:28px;height:19px;border-radius:5px}
.flag.lg{width:72px;height:48px;border-radius:10px}
.flag svg{width:100%;height:100%}
.nation .nm{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nation .pr{font-size:11.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nation .car{color:var(--mut);margin-left:auto}
.nation .car svg{width:16px;height:16px}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(62,224,200,.14);color:var(--acc);letter-spacing:.04em}
.stats{flex:1;display:flex;align-items:center;gap:2px;padding:6px;min-width:0;overflow:hidden}
.stat{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;min-width:0;position:relative;flex:1 1 auto;cursor:default}
.stat:hover{background:rgba(255,255,255,.035)}
.stat+.stat::before{content:'';position:absolute;left:-1px;top:24%;bottom:24%;width:1px;background:var(--line)}
.stat .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.055)}
.stat .ic svg{width:16px;height:16px}
.stat .tx{min-width:0}
.stat .lb{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.11em;font-weight:800;white-space:nowrap}
.stat .vl{font-weight:800;font-size:14.5px;white-space:nowrap;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.stat .sub{font-size:10.5px;font-weight:800;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--bad)}.mu{color:var(--mut)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;width:100%;min-width:54px;margin-top:4px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--grad);transition:width .5s}
.bar.bad i{background:linear-gradient(90deg,#fb7185,#f97316)}
.bar.ok i{background:linear-gradient(90deg,#34d399,#3ee0c8)}
.time{display:flex;align-items:center;gap:8px;padding:7px 9px;flex:none}
.date{font-family:var(--fd);font-size:12px;font-weight:600;padding:0 6px 0 4px;white-space:nowrap;min-width:118px}
.date small{display:block;font-family:var(--fb);font-size:10.5px;color:var(--mut);font-weight:700;margin-top:2px}
.spd{display:flex;gap:3px;background:rgba(0,0,0,.2);padding:3px;border-radius:11px}
.spd button{width:31px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:.15s}
.spd button:hover{color:#fff}
.spd button.on{background:var(--grad);color:#04121f}
.spd svg{width:14px;height:14px}
.menu{position:absolute;right:12px;top:88px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px}
.menu [data-tip]:hover::after{top:50%;left:auto;right:calc(100% + 12px);transform:translateY(-50%)}
.mbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#b8c8e4;position:relative;transition:.15s}
.mbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.mbtn svg{width:19px;height:19px}
.mbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px rgba(11,22,42,.9)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--glass2);border:1px solid var(--line);padding:6px 10px;border-radius:9px;white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--txt);z-index:40;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}

#tools{z-index:2;position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding:7px}
.tool{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#b6c6e2;position:relative;transition:background .15s,color .15s,box-shadow .2s}
.tool:hover{background:rgba(255,255,255,.07);color:#fff}
.tool.on{background:var(--grad);color:#04121f;box-shadow:0 8px 24px rgba(62,224,200,.28)}
.tool svg{width:21px;height:21px}
.tool .tp{position:absolute;left:56px;top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;background:var(--glass2);border:1px solid var(--line);padding:7px 11px;border-radius:10px;white-space:nowrap;font-size:12px;font-weight:700;transition:.15s;color:var(--txt);display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tool:hover .tp{opacity:1;transform:translate(0,-50%)}
kbd{font-family:var(--fb);font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--mut);border:1px solid var(--line)}
.tsep{height:1px;background:var(--line);margin:4px 7px}

#drawer{position:absolute;left:78px;right:250px;bottom:12px;padding:12px 14px 12px;animation:up .25s cubic-bezier(.2,.9,.3,1)}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dhead h3{font-family:var(--fd);font-size:13px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.dhead .hint{font-size:11.5px;color:var(--mut);font-weight:600;margin-left:auto;display:flex;gap:10px;align-items:center;white-space:nowrap;overflow:hidden}
.dhead .x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);flex:none}
.dhead .x:hover{background:rgba(255,255,255,.08);color:#fff}
.dhead .x svg{width:15px;height:15px}
.cards{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px}
.card{flex:none;width:132px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);padding:7px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;position:relative;text-align:left}
.card:hover{transform:translateY(-3px);border-color:rgba(62,224,200,.45)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 10px 28px rgba(62,224,200,.16)}
.card .im{width:100%;height:86px;border-radius:10px;background:radial-gradient(circle at 50% 65%,rgba(90,169,255,.22),rgba(90,169,255,.02) 70%);display:grid;place-items:center;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:contain}
.card .im svg{width:36px;height:36px;color:var(--acc)}
.card .cn{font-weight:800;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cc{font-size:12px;font-weight:800;color:var(--acc);margin-top:1px}
.card .cs{font-size:10.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.card.poor .cc{color:var(--bad)}
.card.lock{cursor:not-allowed}
.card.lock .im,.card.lock .cn,.card.lock .cs{opacity:.42}
.card .lk{position:absolute;left:7px;right:7px;top:7px;height:86px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;border-radius:10px;font-size:10.5px;font-weight:800;color:#d6e4ff;text-align:center;line-height:1.25;padding:6px}
.card .lk svg{width:16px;height:16px;color:var(--warn)}
.card .own{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(52,211,153,.18);color:var(--ok)}

#info{position:absolute;right:76px;top:88px;width:318px;padding:16px;max-height:calc(100vh - 340px);overflow:auto;animation:sl .25s cubic-bezier(.2,.9,.3,1)}
.ih{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ih .th{width:66px;height:66px;border-radius:13px;background:radial-gradient(circle at 50% 65%,rgba(90,169,255,.25),rgba(90,169,255,.03) 70%);flex:none;display:grid;place-items:center;overflow:hidden}
.ih .th img{width:100%;height:100%;object-fit:contain}
.ih .th svg{width:30px;height:30px;color:var(--acc)}
.ih h3{font-family:var(--fd);font-size:14.5px;font-weight:600;line-height:1.3}
.ih .sb{font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ih .cl{margin-left:auto;align-self:flex-start;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);flex:none}
.ih .cl:hover{background:rgba(255,255,255,.08);color:#fff}
.ih .cl svg{width:15px;height:15px}
.stars{color:var(--warn);letter-spacing:1px;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.06);margin:0 4px 5px 0;color:var(--mut)}
.pill.ok{color:var(--ok);background:rgba(52,211,153,.12)}.pill.bad{color:var(--bad);background:rgba(251,113,133,.12)}.pill.wa{color:var(--warn);background:rgba(251,191,36,.12)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv>span:first-child{color:var(--mut);font-weight:600}
.kv>span:last-child{font-weight:800;text-align:right}
.sec{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.cov{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cov div{background:rgba(255,255,255,.04);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:700;color:var(--mut)}
.cov b{display:block;font-size:12.5px;color:var(--txt);margin-bottom:4px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;font-weight:800;font-size:12.5px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--grad);color:#04121f;border:0;box-shadow:0 10px 26px rgba(62,224,200,.22)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{background:rgba(251,113,133,.13);color:#ffb3c0;border-color:rgba(251,113,133,.3)}
.btn.sm{height:32px;padding:0 11px;font-size:11.5px;border-radius:10px}
.btn.f1{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

#mm{position:absolute;right:12px;bottom:12px;padding:9px;width:226px}
#mmc{width:206px;height:206px;border-radius:12px;display:block;cursor:crosshair;background:#0b2a40}
#compass{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(6,14,28,.78);display:grid;place-items:center;border:1px solid var(--line);cursor:pointer}
#compass svg{width:22px;height:22px;transition:transform .1s linear}
#ovLeg:not(.hidden)~#compass{top:66px}
.mmbar{display:flex;gap:5px;margin-top:8px}
.mmbar button{flex:1;height:32px;border-radius:9px;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--mut);transition:.15s}
.mmbar button:hover{color:#fff}
.mmbar button.on{color:var(--acc);background:rgba(62,224,200,.13)}
.mmbar svg{width:16px;height:16px}

#toasts{position:absolute;top:86px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 24px))}
.toast{padding:10px 14px 10px 10px;border-radius:13px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:12.5px;animation:tin .35s cubic-bezier(.2,.9,.3,1.2);max-width:100%}
.toast .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(62,224,200,.15);color:var(--acc)}
.toast .ti svg{width:15px;height:15px}
.toast.bad .ti{background:rgba(251,113,133,.15);color:var(--bad)}
.toast.wa .ti{background:rgba(251,191,36,.15);color:var(--warn)}
.toast.gold .ti{background:rgba(143,125,255,.2);color:#b9adff}
.toast small{display:block;color:var(--mut);font-weight:600;font-size:11.5px;margin-top:1px}
.toast.out{animation:tout .4s forwards}

#tip{position:fixed;z-index:15;pointer-events:none;padding:7px 10px;border-radius:10px;font-size:11.5px;font-weight:800;background:rgba(9,18,34,.9);border:1px solid var(--line);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translate(16px,16px)}
#tip .r{color:var(--bad)}#tip .g{color:var(--ok)}#tip .m{color:var(--mut);font-weight:600}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.nl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .3s;white-space:nowrap}
.nl .flag{width:34px;height:23px}
.nl b{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12px;text-shadow:0 2px 10px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.8)}
.nl i{font-style:normal;font-size:10.5px;font-weight:800;color:#d8e6ff;text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:.85}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:700;font-size:15px;color:#7bf2d9;text-shadow:0 2px 10px rgba(0,0,0,.65);white-space:nowrap;pointer-events:none}
.ft.neg{color:#ff9aab}

#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,9,20,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .2s;padding:16px}
.mbox{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;background:linear-gradient(180deg,rgba(19,36,64,.94),rgba(9,19,37,.96));border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
.mbox.wide{width:min(900px,100%)}
.mh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.mh .mi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(62,224,200,.13);color:var(--acc);flex:none}
.mh .mi svg{width:22px;height:22px}
.mt{font-family:var(--fd);font-size:17px;font-weight:700;line-height:1.3}
.ms{color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.5;font-weight:500}
.mh .cl{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none}
.mh .cl:hover{background:rgba(255,255,255,.08);color:#fff}
.mh .cl svg{width:16px;height:16px}
.mbody{font-size:13px;line-height:1.55}
.mbody p{color:#c6d4ec}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px}
.box .lb{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.box .vl{font-size:18px;font-weight:800;margin-top:4px}
.nrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:9px}
.nrow.act{border-color:rgba(62,224,200,.5);background:rgba(62,224,200,.06)}
.nrow .nn{font-weight:800;font-size:13.5px}
.nrow .ns{font-size:11.5px;color:var(--mut);margin-top:3px;font-weight:600}
.nrow .na{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rel{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;width:150px}
.rel i{display:block;height:100%;border-radius:6px}
.tog{display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.tog:hover{border-color:var(--line2)}
.tog .sw{width:42px;height:24px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:.2s}
.tog .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tog.on .sw{background:var(--acc)}
.tog.on .sw::after{left:21px}
.tog .tt{font-weight:800;font-size:13px}
.tog .td{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.tog .tc{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.1);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(62,224,200,.3);cursor:pointer}

.tinput{width:100%;height:46px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:0 14px;font-weight:700;outline:none;transition:.15s}

.swatch{display:flex;gap:8px;flex-wrap:wrap}

.swatch button.on{box-shadow:0 0 0 2px #fff,0 0 0 6px rgba(255,255,255,.14)}
.flbl{font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 7px;display:block}
.chart{width:100%;height:150px;display:block}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.2);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;height:34px;border-radius:9px;font-weight:800;font-size:12px;color:var(--mut);white-space:nowrap;padding:0 10px}
.tabs button.on{background:rgba(255,255,255,.1);color:#fff}
.lst{display:flex;flex-direction:column;gap:2px}
.lst .kv:last-child{border-bottom:0}
.news{font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line);color:#c6d4ec}
.news b{color:var(--mut);font-weight:700;margin-right:6px}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice .btn{height:auto;padding:12px 15px;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.4}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;padding:24px 6vw;background:linear-gradient(90deg,rgba(5,12,28,.92) 0%,rgba(5,12,28,.7) 38%,rgba(5,12,28,0) 75%);overflow:auto}
.tp{width:min(430px,100%);animation:sl2 .7s cubic-bezier(.2,.9,.3,1)}
.kick{font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--acc);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.kick::before{content:'';width:26px;height:2px;background:var(--grad);border-radius:2px}
.logo{font-family:var(--fd);font-weight:800;font-size:clamp(38px,5.4vw,66px);letter-spacing:.02em;background:linear-gradient(120deg,#ffffff 10%,#a8f3e6 45%,#8ea2ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.02;margin-top:14px}
.tag{font-size:15px;color:#bccbe6;margin-top:12px;line-height:1.55;font-weight:500}
.tcard{margin-top:24px;padding:18px}
.trow{display:flex;gap:8px;margin-top:18px}
.seed{display:flex;gap:8px;align-items:center}
.seed .tinput{flex:1}
.feat{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.feat div{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--mut);font-weight:700}
.feat svg{width:15px;height:15px;color:var(--acc)}

#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 40%,#10294a,#060f20);transition:opacity .6s}
#loading .lb2{width:min(320px,80vw);text-align:center}
#loading .logo{font-size:34px;margin:0}
.lbar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:22px}
.lbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
#ltxt{font-size:12px;color:var(--mut);margin-top:12px;font-weight:600}

#track{position:absolute;left:76px;top:88px;width:296px;padding:12px;z-index:1;animation:sl2 .45s cubic-bezier(.2,.9,.3,1)}
.trh{display:flex;align-items:center;gap:10px;cursor:pointer}
.tri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(143,125,255,.2);color:#c0b5ff;flex:none}
.tri svg{width:18px;height:18px}
.trk{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.trt{font-family:var(--fd);font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trc{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:transform .2s;flex:none}
.trc svg{width:15px;height:15px}.trc.cl{transform:rotate(-90deg)}

.trl{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.mis{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.15s;width:100%}
.mis:hover{border-color:rgba(62,224,200,.45);background:rgba(62,224,200,.06)}
.mck{width:15px;height:15px;border-radius:50%;border:2px solid rgba(150,190,255,.35);flex:none;margin-top:2px}
.mtx{flex:1;min-width:0}.mtx b{display:block;font-size:12px;font-weight:800}.mtx small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px;line-height:1.35}
.mtx .bar{margin-top:7px}
.mrw{text-align:right;flex:none;font-size:11px;font-weight:800;white-space:nowrap}.mrw em{display:block;font-style:normal;color:#c0b5ff;font-size:10.5px;margin-top:3px}
.rci{display:flex;gap:5px;justify-content:center;padding:6px 0 14px;position:relative;cursor:default}
.rci div{width:9px;height:40px;background:rgba(255,255,255,.07);border-radius:4px;display:flex;align-items:flex-end;position:relative}
.rci div i{display:block;width:100%;border-radius:4px;transition:height .6s}
.rci div:nth-child(1) i{background:linear-gradient(0deg,#16a34a,#34d399)}.rci div:nth-child(2) i{background:linear-gradient(0deg,#2563eb,#60a5fa)}.rci div:nth-child(3) i{background:linear-gradient(0deg,#d97706,#fbbf24)}
.rci div b{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:800;color:var(--mut)}
.rci .tp{position:absolute;left:56px;top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;background:var(--glass2);border:1px solid var(--line);padding:7px 11px;border-radius:10px;white-space:nowrap;font-size:12px;font-weight:600;transition:.15s;color:var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rci:hover .tp{opacity:1;transform:translate(0,-50%)}
.mbtn .lkd{position:absolute;bottom:4px;right:4px;width:15px;height:15px;border-radius:50%;background:#0b162a;display:grid;place-items:center;color:var(--warn);box-shadow:0 0 0 1px var(--line)}
.mbtn .lkd svg{width:9px;height:9px}
.dpop{position:absolute;right:0;bottom:calc(100% + 8px);width:226px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;z-index:3}
.dpop button{display:flex;align-items:center;gap:7px;padding:8px;border-radius:10px;font-size:11px;font-weight:700;color:#c6d4ec;background:rgba(255,255,255,.04);text-align:left}
.dpop button:hover{background:rgba(255,255,255,.09)}.dpop button.on{background:rgba(62,224,200,.15);color:var(--acc)}
.dpop svg{width:15px;height:15px;flex:none}
#ovLeg{margin-bottom:8px;font-size:10.5px;font-weight:700;color:var(--mut)}
#ovLeg b{color:var(--txt);display:block;margin-bottom:6px;font-size:11.5px}
.lg{display:flex;align-items:center;gap:6px}.lg i{flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,#ff4d6a,#ffc53d,#2ee6a0)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sl2{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:1280px){.stat .sub{display:none}.stat{padding:5px 8px}.stat .ic{width:28px;height:28px}}
@media (max-width:1440px){.stat .ic{display:none}}
@media (max-width:1180px){.stat.opt{display:none}.nation{max-width:220px}}
@media (max-width:980px){.stat .ic{display:none}}
@media (max-width:820px){
  #top{flex-wrap:wrap;top:8px;left:8px;right:8px;gap:6px}
  .nation{flex:1 1 auto;max-width:none;padding:7px 10px 7px 8px}
  .flag{width:36px;height:24px}
  .stats{order:3;flex:1 1 100%;overflow-x:auto}
  .stat{flex:none}
  .time .date{min-width:0;font-size:11px}
  .menu{top:150px;transform:none;right:8px;padding:5px}
  .mbtn{width:34px;height:34px}
  .stat .ic{display:flex}
  #tools{top:auto;bottom:8px;left:8px;right:8px;transform:none;flex-direction:row;overflow-x:auto;padding:5px}
  .tool{width:42px;height:42px;flex:none}
  .tool .tp,.tsep{display:none}
  #drawer{left:8px;right:8px;bottom:68px;padding:10px}
  .dhead .hint{display:none}
  #mm{display:none}
  #info{left:8px;right:8px;top:auto;bottom:68px;width:auto;max-height:46vh}
  #toasts{top:150px}
  #track{left:8px;right:52px;top:166px;width:auto;padding:9px}
  .rci{display:none}
  #title{background:rgba(5,12,28,.82);align-items:flex-start}
}

function nationRoads(n) { const r = []; for (const i of S.roadSet) if (owner[i] === n.id) r.push(i); return r; }
function aiAct(n) {
  if (n.treasury < 100e3) return;
  const R = Math.random; let type;
  if (n.pd > n.ps * 0.9) type = n.pop > 9000 && R() < 0.5 ? 'coal' : R() < 0.5 ? 'wind' : 'solar';
  else if (n.wd > n.ws * 0.9) type = n.pop > 16000 ? 'waterplant' : 'watertower';
  else if (R() < 0.2) { if (!aiRoad(n)) aiExpand(n); return; }
  else if (R() < 0.07 && n.pop > 1500) type = ['school', 'clinic', 'police', 'park', 'fire', 'park', 'plaza'][Math.floor(R() * 7)];
  else if (n.workers > n.jobs * 0.92) type = n.pop < 3000 ? 'shop' : R() < 0.35 ? 'factory' : n.pop > 7000 && R() < 0.4 ? 'mall' : n.pop > 22000 && R() < 0.3 ? 'office' : 'shop';
  else type = n.pop > 18000 && R() < 0.3 ? 'tower' : n.pop > 3000 && R() < 0.55 ? 'apartment' : 'house';
  const d = BT[type]; if ((d.unlock || 0) > n.pop * 1.3 || n.treasury < d.cost + 60e3) return;
  const sp = findSpot(n, type); if (!sp) { if (!aiRoad(n)) aiExpand(n); return; }
  n.treasury -= d.cost; placeBuilding(type, sp.x, sp.z, n, {});
}
function findSpot(n, type) {
  const s = BT[type].s, roads = nationRoads(n); if (!roads.length) return null;
  for (let t = 0; t < 50; t++) {
    const i = roads[Math.floor(Math.random() * roads.length)], rx = i % MAP, rz = (i / MAP) | 0, d = DIRS[Math.floor(Math.random() * 4)];
    let ox = d[0] === 1 ? rx + 1 : d[0] === -1 ? rx - s : rx - Math.floor(Math.random() * s);
    let oz = d[1] === 1 ? rz + 1 : d[1] === -1 ? rz - s : rz - Math.floor(Math.random() * s);

}
function aiRoad(n) {
  const roads = nationRoads(n), cx = n.capital.x, cz = n.capital.z;
  for (let t = 0; t < 30; t++) {
    const i = roads[Math.floor(Math.random() * roads.length)]; if (i == null) return false;
    const x = i % MAP, z = (i / MAP) | 0, d = Math.floor(Math.random() * 4), [dx, dz] = DIRS[d];
    if (dx !== 0 && ((z - cz) % 4 + 4) % 4 !== 0) continue; if (dz !== 0 && ((x - cx) % 4 + 4) % 4 !== 0) continue;
    const L = []; let X = x + dx, Z = z + dz;
    for (let k = 0; k < 8; k++, X += dx, Z += dz) { if (!inb(X, Z)) break; const j = ix(X, Z); if (road[j]) break; if (!roadOK(j, n) || terr[j] <= 1) break; L.push(j); }
    if (L.length >= 2) { for (const j of L) placeRoad(j); n.treasury -= L.length * ROAD_COST; return true; }
  }

}
function aiExpand(n) {
  if (n.tiles > 1600) return;
  const cand = [];
  for (let z = 0; z < MAP; z++) for (let x = 0; x < MAP; x++) {
    const i = ix(x, z); if (owner[i] !== -1) continue;
    let adj = false; for (const [dx, dz] of DIRS) if (inb(x + dx, z + dz) && owner[ix(x + dx, z + dz)] === n.id) adj = true;
    if (adj) cand.push([i, Math.hypot(x - n.capital.x, z - n.capital.z)]);
  }
  cand.sort((a, b) => a[1] - b[1]); const take = cand.slice(0, 50);
  for (const [i] of take) owner[i] = n.id; n.tiles += take.length; if (take.length) S.terrDirty = true;
}

const cam = { tx: 0, tz: 0, dist: 165, yaw: 0.7, pitch: 0.72, gtx: 0, gtz: 0, gdist: 165, gyaw: 0.7, gpitch: 0.72 };

function rle(a) { const o = []; let v = a[0], c = 1; for (let i = 1; i < a.length; i++) { if (a[i] === v) c++; else { o.push(v, c); v = a[i]; c = 1; } } o.push(v, c); return o; }
